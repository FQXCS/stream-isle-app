// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    // 国内网络镜像：阿里云优先（Central 实测仅 ~7KB/s 会超时），Maven Central 兜底
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    // 国内网络镜像：阿里云优先（Central 实测仅 ~7KB/s 会超时），Maven Central 兜底
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// M8 音画同步延时：media3 1.12 提供 SubtitleConfiguration.timeOffsetUs（稳定版未发，见 docs/todo/media3-稳定版回切.md）
ext {
  media3Version = '1.12.0-beta01'
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
