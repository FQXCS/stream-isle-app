# Stream Isle Mobile CI（M1 文档 §6.4；设计文档 §12）
# 四关全绿为合并条件：lint + tsc + jest + Android debug 构建
name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21：compileSdk 37（RN 0.88 版本目录）的 core-for-system-modules.jar 需 JDK 21 的
          # jlink 处理（JDK 17 实测 JdkImageTransform 失败，见 docs/07-实施决策记录.md）
          java-version: 21

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁 1/3 lint
        run: npm run lint

      - name: 质量门禁 2/3 tsc
        run: npx tsc --noEmit

      - name: 质量门禁 3/3 jest
        run: npx jest

      - name: Android debug 构建（android/ 已入库；prebuild 后断言产物无 diff，防 app.config 与 android/ 漂移）
        run: |
          npx expo prebuild -p android --no-install
          # 06 §4.9.2「prebuild 校验产物无 diff」可执行断言：prebuild 重放后 android/ 入库文件
          # 必须与提交一致（构建产物已被 .gitignore 排除，不参与 diff）；漂移即失败并列出差异
          if ! git diff --exit-code -- android/; then
            echo "::error::expo prebuild 产物与入库 android/ 存在漂移——请本地跑 npx expo prebuild -p android 后提交更新（勿手改 android/ 内由 plugin 驱动的文件）"
            exit 1
          fi
          cd android && ./gradlew assembleDebug
