# Stream Isle Release（M6 文档 §4.9.2；TV 设计 §4.2 同 tag 双 APK，2026-11-28 修订）
# 触发：v* tag → 同一 GitHub Release 附加双 APK：
#   StreamIsle-{version}({code}).apk（手机）+ StreamIsle-TV-{version}({code}).apk（TV）。
# 流程：build-mobile / build-tv 并行（复跑门禁 → keystore 解码（仓库 Secrets 四件套，双端同证书）
#   → assembleRelease → 重命名 → artifact）→ publish-release 汇总产出 notes
#   （tag message 引言 + 上一 v* tag 以来 mobile/ 与 tv/ 路径提交）→ 单 Release 附双 APK。
# 版本名两端同步（bump 一次 commit 同改两端）；单 Release 序列默认 Latest，无端徽标抢占问题。
name: mobile-release

on:
  push:
    tags: ['v*']

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    # TV-m0 工程平移：手机工程移至 mobile/，全部 run 步骤统一 working-directory
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 58 要求 Node >= 22.13，与 mobile-ci.yml 保持一致
          # setup-node 无 working-directory 概念，写相对仓库根路径
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21：compileSdk 37（RN 0.88 版本目录）构建需要（同 mobile-ci.yml 决策）
          java-version: 21

      - name: 安装依赖
        run: npm ci

      # TV-m0：仓库根共享插件依赖（prebuild 经 plugins/ 装配需要）
      - name: 安装仓库根共享插件依赖
        run: npm ci
        working-directory: .

      # —— 与 CI 同序的质量门禁（release 前置复跑，M6 §4.9.2「node 环境与 ci 同序的 lint/test 门禁」）——
      - name: 质量门禁 1/3 lint
        run: npm run lint

      - name: 质量门禁 2/3 tsc
        run: npx tsc --noEmit

      - name: 质量门禁 3/3 jest
        run: npx jest

      - name: 还原 keystore（仓库 Secrets 四件套，M6 §4.9.1）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          echo "ANDROID_KEYSTORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"

      - name: Android 签名构建（assembleRelease）
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: 重命名 APK（StreamIsle-{versionName}({versionCode}).apk）
        # APK 落在 mobile/（本步 working-directory）；APK_TARGET 供 uses 步（upload-artifact，
        # 无 working-directory 概念）以仓库根相对路径消费
        run: |
          VERSION_NAME=$(node -e "console.log(require('./app.config.json')?.expo?.version ?? '')" 2>/dev/null || node -e "const c=require('fs').readFileSync('app.config.ts','utf8');const m=c.match(/version:\s*\"([^\"]+)\"/);console.log(m?m[1]:'unknown')")
          VERSION_CODE=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk)
          TARGET="StreamIsle-${VERSION_NAME}(${VERSION_CODE}).apk"
          cp "$APK" "$TARGET"
          echo "APK_TARGET=mobile/$TARGET" >> "$GITHUB_ENV"

      - name: 上传 artifact（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-mobile
          path: ${{ env.APK_TARGET }}
          retention-days: 30

  build-tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21：与 mobile job 同口径（compileSdk 37 需要）
          java-version: 21

      - name: 释放 Runner 磁盘空间
        # release 构建全 ABI（发布包需覆盖真机），与 CI 同口径清理预装组件防写满磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images
          df -h /
        working-directory: .

      # tv/.npmrc legacy-peer-deps=true（fork prerelease 版本号 peer 冲突，TV-m0 定案）
      - name: 安装依赖
        run: npm ci

      # TV-m0：仓库根共享插件依赖（prebuild 经 plugins/ 装配需要）
      - name: 安装仓库根共享插件依赖
        run: npm ci
        working-directory: .

      # TV-m2：tv tsc 经 ../mobile/src 类型检查共享层，bare import 需 mobile/node_modules
      - name: 安装共享层依赖（tv tsc 解析 ../mobile/src 的 bare import）
        run: npm ci
        working-directory: mobile

      - name: 质量门禁 1/2 lint（含 @tv/ 边界规则）
        run: npm run lint

      - name: 质量门禁 2/2 tsc（fork 类型检查共享层）
        run: npm run typecheck

      - name: TV prebuild 漂移断言（android/ 已入库，防 app.config 与产物漂移）
        run: |
          npx expo prebuild -p android --no-install
          cd .. && git diff --exit-code -- tv/android/ || {
            echo "::error::tv prebuild 漂移——请本地跑 cd tv && npx expo prebuild -p android 后提交更新"
            exit 1
          }

      - name: 还原 keystore（与手机同 Secrets 四件套，同开发者证书；包名不同可共存安装）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          echo "ANDROID_KEYSTORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"

      - name: Android TV 签名构建（assembleRelease，withReleaseSigning 构建期读 keystore）
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: 重命名 APK（StreamIsle-TV-{versionName}({versionCode}).apk）
        run: |
          VERSION_NAME=$(node -e "const c=require('fs').readFileSync('app.config.ts','utf8');const m=c.match(/version:\s*'([^']+)'/);console.log(m?m[1]:'unknown')")
          VERSION_CODE=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk)
          TARGET="StreamIsle-TV-${VERSION_NAME}(${VERSION_CODE}).apk"
          cp "$APK" "$TARGET"
          echo "APK_TARGET=tv/$TARGET" >> "$GITHUB_ENV"

      - name: 上传 artifact（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-tv
          path: ${{ env.APK_TARGET }}
          retention-days: 30

  publish-release:
    # 汇总双端 artifact → 单 Release 附双 APK（同 tag 双 APK，2026-11-28 修订）
    needs: [build-mobile, build-tv]
    runs-on: ubuntu-latest
    # GITHUB_TOKEN 默认只读，创建 Release 需显式授予 contents 写权限（否则 403）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史 + tags：release notes 需定位上一版本 tag 并生成提交清单
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-apk-mobile
          path: apks/mobile

      - uses: actions/download-artifact@v4
        with:
          name: release-apk-tv
          path: apks/tv

      - name: 读取版本号（两端 version 同步，取手机端即可）
        run: |
          VERSION_NAME=$(node -e "const c=require('fs').readFileSync('mobile/app.config.ts','utf8');const m=c.match(/version:\s*\"([^\"]+)\"/);console.log(m?m[1]:'unknown')")
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: 产出 Release notes（tag message 引言 + 上一 v* 以来 mobile/ 与 tv/ 路径提交，中文）
        run: |
          # tag message 作引言；轻量 tag 无自身 message，跳过引言只留提交清单
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          else
            : > release-notes.md
          fi
          # 基线取 v* 序列上一 tag（排除当前）；首个版本无上一 tag 时取全部历史
          PREV_TAG=$(git tag --list 'v*' --sort=creatordate | grep -v -x -F "${GITHUB_REF_NAME}" | tail -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            echo "## 更新内容（${PREV_TAG} → ${GITHUB_REF_NAME}）" >> release-notes.md
          else
            RANGE="${GITHUB_REF_NAME}"
            echo "## 更新内容" >> release-notes.md
          fi
          echo "" >> release-notes.md
          # 排除 merge 提交；单 Release 覆盖双端，notes 含 mobile/ 与 tv/ 路径提交
          # （pathspec 按提交时路径，m0 平移前历史 root src/ 不入 notes）
          git log "$RANGE" --no-merges --format='- %s' -- mobile/ tv/ >> release-notes.md
          echo "NOTES_PATH=release-notes.md" >> "$GITHUB_ENV"

      - name: 附加双 APK 到 GitHub Release（title 不带端名；单序列默认 Latest）
        uses: softprops/action-gh-release@v2
        with:
          name: Stream Isle v${{ env.VERSION_NAME }}
          files: |
            apks/mobile/*.apk
            apks/tv/*.apk
          body_path: ${{ env.NOTES_PATH }}
