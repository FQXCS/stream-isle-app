# Stream Isle Mobile Release（M6 文档 §4.9.2；设计文档 §12/§14）
# 触发：推送 v* tag → 复跑 lint/test 门禁 → 解码 keystore（仓库 Secrets 四件套）
# → assembleRelease 签名 APK → 重命名 StreamIsle-{versionName}({versionCode}).apk
# → 上传 artifact + softprops/action-gh-release 附加 APK（release notes = tag message 引言 + 上一 tag 以来全部提交）。
name: mobile-release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    # TV-m0 工程平移：手机工程移至 mobile/，全部 run 步骤统一 working-directory
    defaults:
      run:
        working-directory: mobile
    # GITHUB_TOKEN 默认只读，创建 Release 需显式授予 contents 写权限（否则 403）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史 + tags：release notes 需定位上一版本 tag 并生成提交清单
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 58 要求 Node >= 22.13，与 mobile-ci.yml 保持一致
          # setup-node 无 working-directory 概念，写相对仓库根路径
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21：compileSdk 37（RN 0.88 版本目录）构建需要（同 mobile-ci.yml 决策）
          java-version: 21

      - name: 安装依赖
        run: npm ci

      # TV-m0：仓库根共享插件依赖（prebuild 经 plugins/ 装配需要）
      - name: 安装仓库根共享插件依赖
        run: npm ci
        working-directory: .

      # —— 与 CI 同序的质量门禁（release 前置复跑，M6 §4.9.2「node 环境与 ci 同序的 lint/test 门禁」）——
      - name: 质量门禁 1/3 lint
        run: npm run lint

      - name: 质量门禁 2/3 tsc
        run: npx tsc --noEmit

      - name: 质量门禁 3/3 jest
        run: npx jest

      - name: 还原 keystore（仓库 Secrets 四件套，M6 §4.9.1）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          echo "ANDROID_KEYSTORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"

      - name: Android 签名构建（assembleRelease）
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: 重命名 APK（StreamIsle-{versionName}({versionCode}).apk）
        # APK 与 notes 文件均落在 mobile/（本步 working-directory）；APK_TARGET/NOTES_PATH
        # 供 uses 步（upload-artifact / gh-release，无 working-directory 概念）以仓库根相对路径消费
        run: |
          VERSION_NAME=$(node -e "console.log(require('./app.config.json')?.expo?.version ?? '')" 2>/dev/null || node -e "const c=require('fs').readFileSync('app.config.ts','utf8');const m=c.match(/version:\s*\"([^\"]+)\"/);console.log(m?m[1]:'unknown')")
          VERSION_CODE=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | grep -o '[0-9]*')
          APK=$(ls android/app/build/outputs/apk/release/app-release.apk)
          TARGET="StreamIsle-${VERSION_NAME}(${VERSION_CODE}).apk"
          cp "$APK" "$TARGET"
          echo "APK_TARGET=mobile/$TARGET" >> "$GITHUB_ENV"

      - name: 上传 artifact（保留 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_TARGET }}
          retention-days: 30

      - name: 产出 Release notes（tag message 引言 + 上一版本以来全部提交，中文；返工勘误：不得传空 body_path）
        run: |
          # tag message 作引言；轻量 tag 无自身 message，跳过引言只留提交清单
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          else
            : > release-notes.md
          fi
          # 按提交时间定位上一版本 tag；首个版本无上一 tag 时取全部历史
          PREV_TAG=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags \
            | grep -v -x -F "${GITHUB_REF_NAME}" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            echo "## 更新内容（${PREV_TAG} → ${GITHUB_REF_NAME}）" >> release-notes.md
          else
            RANGE="${GITHUB_REF_NAME}"
            echo "## 更新内容" >> release-notes.md
          fi
          echo "" >> release-notes.md
          # 排除 merge 提交，避免「Merge remote-tracking branch」等噪音进入简介
          git log "$RANGE" --no-merges --format='- %s' >> release-notes.md
          echo "NOTES_PATH=mobile/release-notes.md" >> "$GITHUB_ENV"

      - name: 附加 APK 到 GitHub Release（notes = tag message 引言 + 提交清单，中文）
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_TARGET }}
          body_path: ${{ env.NOTES_PATH }}
